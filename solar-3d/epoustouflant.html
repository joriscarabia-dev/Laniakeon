<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Éruptions Solaires Époustouflantes</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000000;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>

    <script>
// ============================================================================
// ÉRUPTIONS SOLAIRES ÉPOUSTOUFLANTES - Version Ultimate
// Pas d'écran de démarrage, chargement instantané, effets maximisés
// ============================================================================

// Configuration Ultra
const CONFIG = {
    starRadius: 8.0,
    particleCount: 200000,
    loopCount: 100,
    fogColor: 0x000000,
    fogDensity: 0.0015,
    bloomStrength: 2.0,
    bloomRadius: 0.6,
    bloomThreshold: 0.0,
    cameraDistance: 120,
    autoRotateSpeed: 0.5,
    pulseIntensity: 0.05
};

// Bruit de Simplex 3D Optimisé
const SimplexNoise = function() {
    var F3 = 1.0 / 3.0, G3 = 1.0 / 6.0;
    var p = new Uint8Array(256);
    for (var i = 0; i < 256; i++) p[i] = Math.floor(Math.random() * 256);
    var perm = new Uint8Array(512), permMod12 = new Uint8Array(512);
    for (var i = 0; i < 512; i++) {
        perm[i] = p[i & 255];
        permMod12[i] = (perm[i] % 12);
    }
    return {
        noise3D: function(xin, yin, zin) {
            var n0, n1, n2, n3;
            var s = (xin + yin + zin) * F3;
            var i = Math.floor(xin + s), j = Math.floor(yin + s), k = Math.floor(zin + s);
            var t = (i + j + k) * G3;
            var X0 = i - t, Y0 = j - t, Z0 = k - t;
            var x0 = xin - X0, y0 = yin - Y0, z0 = zin - Z0;
            var i1, j1, k1, i2, j2, k2;
            if (x0 >= y0) {
                if (y0 >= z0) { i1=1; j1=0; k1=0; i2=1; j2=1; k2=0; }
                else if (x0 >= z0) { i1=1; j1=0; k1=0; i2=1; j2=0; k2=1; }
                else { i1=0; j1=0; k1=1; i2=1; j2=0; k2=1; }
            } else {
                if (y0 < z0) { i1=0; j1=0; k1=1; i2=0; j2=1; k2=1; }
                else if (x0 < z0) { i1=0; j1=1; k1=0; i2=0; j2=1; k2=1; }
                else { i1=0; j1=1; k1=0; i2=1; j2=1; k2=0; }
            }
            var x1 = x0 - i1 + G3, y1 = y0 - j1 + G3, z1 = z0 - k1 + G3;
            var x2 = x0 - i2 + 2.0*G3, y2 = y0 - j2 + 2.0*G3, z2 = z0 - k2 + 2.0*G3;
            var x3 = x0 - 1.0 + 3.0*G3, y3 = y0 - 1.0 + 3.0*G3, z3 = z0 - 1.0 + 3.0*G3;
            var ii = i & 255, jj = j & 255, kk = k & 255;
            var gi0 = permMod12[ii+perm[jj+perm[kk]]];
            var gi1 = permMod12[ii+i1+perm[jj+j1+perm[kk+k1]]];
            var gi2 = permMod12[ii+i2+perm[jj+j2+perm[kk+k2]]];
            var gi3 = permMod12[ii+1+perm[jj+1+perm[kk+1]]];
            var t0 = 0.6 - x0*x0 - y0*y0 - z0*z0; if (t0<0) n0 = 0.0; else { t0 *= t0; n0 = t0 * t0 * (gi0%2===0?1:-1)*(x0 + y0); }
            var t1 = 0.6 - x1*x1 - y1*y1 - z1*z1; if (t1<0) n1 = 0.0; else { t1 *= t1; n1 = t1 * t1 * (gi1%2===0?1:-1)*(x1 + y1); }
            var t2 = 0.6 - x2*x2 - y2*y2 - z2*z2; if (t2<0) n2 = 0.0; else { t2 *= t2; n2 = t2 * t2 * (gi2%2===0?1:-1)*(x2 + y2); }
            var t3 = 0.6 - x3*x3 - y3*y3 - z3*z3; if (t3<0) n3 = 0.0; else { t3 *= t3; n3 = t3 * t3 * (gi3%2===0?1:-1)*(x3 + y3); }
            return 32.0 * (n0 + n1 + n2 + n3);
        }
    };
};

const simplex = SimplexNoise();

// Scène
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(CONFIG.fogColor, CONFIG.fogDensity);

// Caméra - Position optimisée pour une vue époustouflante
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 3000);
camera.position.set(0, CONFIG.cameraDistance * 0.6, CONFIG.cameraDistance);

// Renderer - Ultra performant
const renderer = new THREE.WebGLRenderer({ 
    antialias: true, 
    alpha: false,
    powerPreference: "high-performance"
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.5;
renderer.shadowMap.enabled = true;
container.appendChild(renderer.domElement);

// Contrôles
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.maxDistance = 500;
controls.minDistance = 30;
controls.autoRotate = true;
controls.autoRotateSpeed = CONFIG.autoRotateSpeed;
controls.rotateSpeed = 0.5;

// Post-processing - Bloom époustouflant
let composer;
let bloomPass;

function initPostProcessing() {
    composer = new THREE.EffectComposer(renderer);
    
    const renderPass = new THREE.RenderPass(scene, camera);
    composer.addPass(renderPass);
    
    bloomPass = new THREE.UnrealBloomPass(
        new THREE.Vector2(window.innerWidth, window.innerHeight),
        CONFIG.bloomStrength,
        CONFIG.bloomRadius,
        CONFIG.bloomThreshold
    );
    composer.addPass(bloomPass);
    
    const copyPass = new THREE.ShaderPass(THREE.CopyShader);
    copyPass.renderToScreen = true;
    composer.addPass(copyPass);
}

// Shaders Améliorés
const starGlowVertexShader = `
    varying vec3 vNormal;
    varying vec3 vWorldPosition;
    
    void main() {
        vNormal = normalize(normalMatrix * normal);
        vec4 worldPos = modelMatrix * vec4(position, 1.0);
        vWorldPosition = worldPos.xyz;
        gl_Position = projectionMatrix * viewMatrix * worldPos;
    }
`;

const starGlowFragmentShader = `
    varying vec3 vNormal;
    varying vec3 vWorldPosition;
    
    uniform float uTime;
    uniform vec3 uColor1;
    uniform vec3 uColor2;
    
    void main() {
        vec3 viewDir = normalize(cameraPosition - vWorldPosition);
        float intensity = pow(0.72 - dot(vNormal, viewDir), 4.0);
        
        // Dégradé dynamique entre deux couleurs
        vec3 colCore = mix(uColor1, uColor2, sin(uTime * 0.3) * 0.5 + 0.5);
        vec3 colRim = vec3(0.3, 0.0, 0.1);
        vec3 finalColor = mix(colCore, colRim, intensity);
        
        // Pulsation intense
        float pulse = 1.0 + sin(uTime * 3.0) * 0.15 + sin(uTime * 0.7) * 0.05;
        finalColor *= pulse;
        
        gl_FragColor = vec4(finalColor, intensity * 0.9);
    }
`;

const particleVertexShader = `
    attribute float size;
    attribute vec3 color;
    attribute float phase;
    varying vec3 vColor;
    varying float vPhase;
    uniform float uTime;
    uniform float uGlobalTime;
    
    void main() {
        vColor = color;
        vPhase = phase;
        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        
        // Scintillement ultra-rapide et synchronisé
        float twinkle = 0.8 + 0.2 * sin(uTime * 15.0 + phase * 20.0 + uGlobalTime * 2.0);
        
        // Variation de taille basée sur la distance
        float sizeMultiplier = 350.0 / (-mvPosition.z + 50.0);
        gl_PointSize = size * twinkle * sizeMultiplier;
        
        gl_Position = projectionMatrix * mvPosition;
    }
`;

const particleFragmentShader = `
    varying vec3 vColor;
    varying float vPhase;
    
    uniform float uTime;
    uniform vec3 uGlowColor;
    
    void main() {
        vec2 coord = gl_PointCoord - vec2(0.5);
        float dist = length(coord);
        
        if (dist > 0.5) discard;
        
        // Glow intense avec bordure lumineuse
        float glow = pow(1.0 - (dist * 2.0), 4.0);
        vec3 brightCenter = mix(vColor, uGlowColor, glow * 0.7);
        
        // Brillance supplémentaire
        float sparkle = pow(sin(vPhase * 10.0 + uTime * 5.0), 2.0);
        brightCenter += vec3(sparkle * 0.5);
        
        gl_FragColor = vec4(brightCenter, glow * 0.95);
    }
`;

// Cœur Solaire Amélioré
const coreGroup = new THREE.Group();
scene.add(coreGroup);

// Noyau interne plus sombre
const innerGeo = new THREE.SphereGeometry(CONFIG.starRadius * 0.85, 64, 64);
const innerMat = new THREE.MeshBasicMaterial({ color: 0x0a0308 });
const innerMesh = new THREE.Mesh(innerGeo, innerMat);
coreGroup.add(innerMesh);

// Glow principal avec shaders améliorés
const glowGeo = new THREE.SphereGeometry(CONFIG.starRadius * 1.1, 64, 64);
const glowMat = new THREE.ShaderMaterial({
    vertexShader: starGlowVertexShader,
    fragmentShader: starGlowFragmentShader,
    uniforms: {
        uTime: { value: 0 },
        uColor1: { value: new THREE.Color(1.0, 0.4, 0.1) },  // Orange chaud
        uColor2: { value: new THREE.Color(1.0, 0.2, 0.5) }   // Rose
    },
    blending: THREE.AdditiveBlending,
    side: THREE.BackSide,
    transparent: true
});
const glowMesh = new THREE.Mesh(glowGeo, glowMat);
coreGroup.add(glowMesh);

// Glow externe pour plus de profondeur
const outerGlowGeo = new THREE.SphereGeometry(CONFIG.starRadius * 1.8, 64, 64);
const outerGlowMat = new THREE.ShaderMaterial({
    vertexShader: starGlowVertexShader,
    fragmentShader: `
        varying vec3 vNormal;
        varying vec3 vWorldPosition;
        uniform float uTime;
        void main() {
            vec3 viewDir = normalize(cameraPosition - vWorldPosition);
            float intensity = pow(0.5 - dot(vNormal, viewDir), 3.0);
            vec3 color = vec3(0.2, 0.1, 0.4) * (1.0 + sin(uTime * 0.5) * 0.3);
            gl_FragColor = vec4(color, intensity * 0.4);
        }
    `,
    uniforms: { uTime: { value: 0 } },
    blending: THREE.AdditiveBlending,
    side: THREE.BackSide,
    transparent: true
});
const outerGlowMesh = new THREE.Mesh(outerGlowGeo, outerGlowMat);
coreGroup.add(outerGlowMesh);

// Boucles Coronales - Plus nombreuses et plus dynamiques
const magneticLoops = [];

function generateCoronalLoops() {
    for (let l = 0; l < CONFIG.loopCount; l++) {
        const theta1 = Math.random() * Math.PI * 2;
        const phi1 = (Math.random() - 0.5) * Math.PI * 1.2;
        
        const p1 = new THREE.Vector3().setFromSphericalCoords(
            CONFIG.starRadius * (0.8 + Math.random() * 0.3), 
            phi1 + Math.PI/2, 
            theta1
        );
        
        const span = 0.5 + Math.random() * 3.5;
        const theta2 = theta1 + (Math.random() - 0.5) * span;
        const phi2 = phi1 + (Math.random() - 0.5) * span;
        const p2 = new THREE.Vector3().setFromSphericalCoords(
            CONFIG.starRadius * (0.8 + Math.random() * 0.3), 
            phi2 + Math.PI/2, 
            theta2
        );
        
        const mid = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);
        const apexDist = CONFIG.starRadius + 15.0 + Math.pow(Math.random(), 1.2) * 70.0;
        mid.normalize().multiplyScalar(apexDist);
        
        // Ajout d'un point de contrôle supplémentaire pour des boucles plus complexes
        const control1 = new THREE.Vector3().lerpVectors(p1, mid, 0.3);
        const control2 = new THREE.Vector3().lerpVectors(mid, p2, 0.3);
        
        magneticLoops.push({
            curve: new THREE.CubicBezierCurve3(p1, control1, control2, p2),
            speed: 0.1 + Math.random() * 1.2,
            twist: 5.0 + Math.random() * 15.0,
            color: new THREE.Color(Math.random() * 0x666666 + 0x993300)
        });
    }
}

generateCoronalLoops();

// Particules de Plasma - Ultra denses et lumineuses
const particlesGeometry = new THREE.BufferGeometry();
const positions = new Float32Array(CONFIG.particleCount * 3);
const velocities = new Float32Array(CONFIG.particleCount * 3);
const colors = new Float32Array(CONFIG.particleCount * 3);
const sizes = new Float32Array(CONFIG.particleCount);
const phases = new Float32Array(CONFIG.particleCount);

const particleMeta = [];

function initParticles() {
    for (let i = 0; i < CONFIG.particleCount; i++) {
        const idx = i * 3;
        const isLoopParticle = i < CONFIG.particleCount * 0.7; // 70% sur les boucles
        
        if (isLoopParticle) {
            const loopIndex = Math.floor(Math.random() * CONFIG.loopCount);
            particleMeta.push({
                type: 'loop',
                loopIdx: loopIndex,
                progress: Math.random(),
                speed: 0.1 + Math.random() * 0.8,
                offset: (Math.random() - 0.5) * 2.5,
                phaseOffset: Math.random() * Math.PI * 2
            });
            
            positions[idx] = 0;
            positions[idx + 1] = 0;
            positions[idx + 2] = 0;
            
        } else {
            particleMeta.push({
                type: 'eruptive',
                baseSpeed: 1.5 + Math.random() * 4.0,
                life: Math.random() * 100
            });
            
            const u = Math.random();
            const v = Math.random();
            const theta = u * 2.0 * Math.PI;
            const phi = Math.acos(2.0 * v - 1.0);
            const r = CONFIG.starRadius * (0.9 + Math.random() * 0.3);
            
            positions[idx] = r * Math.sin(phi) * Math.cos(theta);
            positions[idx + 1] = r * Math.sin(phi) * Math.sin(theta);
            positions[idx + 2] = r * Math.cos(phi);
            
            const speed = particleMeta[i].baseSpeed;
            velocities[idx] = (positions[idx] / r) * speed;
            velocities[idx + 1] = (positions[idx + 1] / r) * speed;
            velocities[idx + 2] = (positions[idx + 2] / r) * speed;
        }
        
        // Palette Époustouflante - Oranges, roses, violets, bleus
        const color = new THREE.Color();
        const rand = Math.random();
        if (rand < 0.35) {
            color.setHSL(0.08 + Math.random() * 0.04, 1.0, 0.5 + Math.random() * 0.2); // Orange intense
        } else if (rand < 0.65) {
            color.setHSL(0.95 + Math.random() * 0.08, 0.9 + Math.random() * 0.1, 0.5 + Math.random() * 0.2); // Rose/Magenta
        } else if (rand < 0.85) {
            color.setHSL(0.75 + Math.random() * 0.1, 0.8 + Math.random() * 0.2, 0.5 + Math.random() * 0.2); // Violet
        } else {
            color.setHSL(0.55 + Math.random() * 0.1, 0.9 + Math.random() * 0.1, 0.6 + Math.random() * 0.2); // Bleu électrique
        }
        
        colors[idx] = color.r;
        colors[idx + 1] = color.g;
        colors[idx + 2] = color.b;
        
        sizes[i] = 0.3 + Math.random() * 2.5;
        phases[i] = Math.random();
    }
    
    particlesGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    particlesGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    particlesGeometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
    particlesGeometry.setAttribute('phase', new THREE.BufferAttribute(phases, 1));
}

initParticles();

const particleMaterial = new THREE.ShaderMaterial({
    vertexShader: particleVertexShader,
    fragmentShader: particleFragmentShader,
    uniforms: {
        uTime: { value: 0 },
        uGlobalTime: { value: 0 },
        uGlowColor: { value: new THREE.Color(1.0, 0.6, 0.3) }
    },
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false
});

const starParticles = new THREE.Points(particlesGeometry, particleMaterial);
scene.add(starParticles);

// Interaction Tactile
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let isInteracting = false;
let interactionPoint = new THREE.Vector3();
let globalTime = 0;

function updatePointer(e) {
    const x = e.touches ? e.touches[0].clientX : e.clientX;
    const y = e.touches ? e.touches[0].clientY : e.clientY;
    mouse.x = (x / window.innerWidth) * 2 - 1;
    mouse.y = -(y / window.innerHeight) * 2 + 1;
    
    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObject(glowMesh);
    if (intersects.length > 0) {
        interactionPoint.copy(intersects[0].point);
        isInteracting = true;
    } else {
        isInteracting = false;
    }
}

window.addEventListener('pointerdown', (e) => { updatePointer(e); isInteracting = true; });
window.addEventListener('pointermove', (e) => { if (e.buttons > 0 || e.touches) updatePointer(e); });
window.addEventListener('pointerup', () => { isInteracting = false; });

// Éclairage
const ambientLight = new THREE.AmbientLight(0x221108, 0.5);
scene.add(ambientLight);

const pointLight1 = new THREE.PointLight(0xff6633, 2.0, 200);
pointLight1.position.set(50, 30, 20);
scene.add(pointLight1);

const pointLight2 = new THREE.PointLight(0xff3366, 1.5, 150);
pointLight2.position.set(-40, -20, 30);
scene.add(pointLight2);

// Animation
const clock = new THREE.Clock();

function animate() {
    requestAnimationFrame(animate);
    
    const dt = Math.min(clock.getDelta(), 0.05);
    globalTime += dt;
    const time = clock.getElapsedTime();
    
    particleMaterial.uniforms.uTime.value = time;
    particleMaterial.uniforms.uGlobalTime.value = globalTime;
    glowMesh.material.uniforms.uTime.value = time;
    outerGlowMesh.material.uniforms.uTime.value = time;
    
    // Pulsation intense du cœur
    const pulse = 1.0 + Math.sin(time * 2.5) * CONFIG.pulseIntensity + 
                 simplex.noise3D(time * 0.6, 0, 0) * CONFIG.pulseIntensity * 1.5;
    coreGroup.scale.set(pulse, pulse, pulse);
    
    // Rotation lente du cœur pour plus de dynamisme
    coreGroup.rotation.y += dt * 0.05;
    
    const posAttr = particlesGeometry.attributes.position;
    const velAttr = particlesGeometry.attributes.velocity;
    
    for (let i = 0; i < CONFIG.particleCount; i++) {
        const idx = i * 3;
        const meta = particleMeta[i];
        
        if (meta.type === 'loop') {
            // Mouvement hélicoïdal amélioré
            meta.progress += dt * meta.speed * (1.0 + simplex.noise3D(time * 0.3, i * 0.01, 0) * 0.3);
            if (meta.progress > 1.0) meta.progress = 0;
            
            const loop = magneticLoops[meta.loopIdx];
            const point = loop.curve.getPoint(meta.progress);
            
            const tangent = loop.curve.getTangent(meta.progress);
            const normal = new THREE.Vector3(0, 1, 0).cross(tangent).normalize();
            const binormal = tangent.clone().cross(normal).normalize();
            
            const angle = meta.progress * Math.PI * 2 * loop.twist + time * 8.0 + meta.phaseOffset;
            const radius = meta.offset * (1.0 - Math.pow(meta.progress - 0.5, 2) * 3.0);
            
            positions[idx] = point.x + (normal.x * Math.cos(angle) + binormal.x * Math.sin(angle)) * radius;
            positions[idx + 1] = point.y + (normal.y * Math.cos(angle) + binormal.y * Math.sin(angle)) * radius;
            positions[idx + 2] = point.z + (normal.z * Math.cos(angle) + binormal.z * Math.sin(angle)) * radius;
            
        } else {
            // Éjections ultra-dynamiques
            let px = positions[idx];
            let py = positions[idx + 1];
            let pz = positions[idx + 2];
            
            let vx = velocities[idx];
            let vy = velocities[idx + 1];
            let vz = velocities[idx + 2];
            
            // Turbulence améliorée avec plusieurs couches de bruit
            const noiseScale = 0.05;
            const nX1 = simplex.noise3D(px * noiseScale, py * noiseScale, time * 0.9);
            const nY1 = simplex.noise3D(py * noiseScale, pz * noiseScale, time * 0.9);
            const nZ1 = simplex.noise3D(pz * noiseScale, px * noiseScale, time * 0.9);
            
            const nX2 = simplex.noise3D(px * noiseScale * 2, time * 0.5, py * noiseScale * 2);
            const nY2 = simplex.noise3D(py * noiseScale * 2, time * 0.5, pz * noiseScale * 2);
            const nZ2 = simplex.noise3D(pz * noiseScale * 2, time * 0.5, px * noiseScale * 2);
            
            vx += (nX1 + nX2 * 0.5) * dt * 6.0;
            vy += (nY1 + nY2 * 0.5) * dt * 6.0;
            vz += (nZ1 + nZ2 * 0.5) * dt * 6.0;
            
            // Interaction tactile améliorée
            if (isInteracting) {
                const distToTouch = interactionPoint.distanceTo(new THREE.Vector3(px, py, pz));
                if (distToTouch < 40.0) {
                    const boost = (40.0 - distToTouch) * 1.5;
                    const dir = new THREE.Vector3(px, py, pz).normalize();
                    vx += dir.x * boost;
                    vy += dir.y * boost;
                    vz += dir.z * boost;
                    
                    // Effet d'éruption supplémentaire
                    meta.life = 100;
                }
            }
            
            // Gravité améliorée
            const distSq = px * px + py * py + pz * pz;
            const dist = Math.sqrt(distSq);
            const gravity = 30.0 / (distSq + 1.0);
            
            vx -= (px / dist) * gravity * dt * 12;
            vy -= (py / dist) * gravity * dt * 12;
            vz -= (pz / dist) * gravity * dt * 12;
            
            px += vx * dt * 12;
            py += vy * dt * 12;
            pz += vz * dt * 12;
            
            // Récurrence avec variation
            if (dist < CONFIG.starRadius * 0.8 || dist > 150.0 || meta.life <= 0) {
                const u = Math.random();
                const v = Math.random();
                const theta = u * 2.0 * Math.PI;
                const phi = Math.acos(2.0 * v - 1.0);
                const r = CONFIG.starRadius * (0.8 + Math.random() * 0.4);
                
                px = r * Math.sin(phi) * Math.cos(theta);
                py = r * Math.sin(phi) * Math.sin(theta);
                pz = r * Math.cos(phi);
                
                const speed = meta.baseSpeed * (1.0 + Math.random() * 3.0);
                vx = (px / r) * speed;
                vy = (py / r) * speed;
                vz = (pz / r) * speed;
                
                meta.life = 50 + Math.random() * 100;
            }
            
            meta.life -= dt * 10;
            
            positions[idx] = px;
            positions[idx + 1] = py;
            positions[idx + 2] = pz;
            
            velocities[idx] = vx;
            velocities[idx + 1] = vy;
            velocities[idx + 2] = vz;
        }
    }
    
    posAttr.needsUpdate = true;
    controls.update();
    
    // Utiliser le composer si disponible
    if (composer) {
        composer.render();
    } else {
        renderer.render(scene, camera);
    }
}

// Gestion du resize
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    
    if (composer) {
        composer.setSize(window.innerWidth, window.innerHeight);
        bloomPass.resolution.set(window.innerWidth, window.innerHeight);
    }
});

// Initialisation du post-processing
initPostProcessing();

// Démarrage immédiat
animate();

// Optimisation pour mobile
if (/Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
    CONFIG.particleCount = Math.floor(CONFIG.particleCount * 0.4);
    CONFIG.loopCount = Math.floor(CONFIG.loopCount * 0.6);
    
    // Re-générer avec moins de particules
    const reducedPositions = new Float32Array(CONFIG.particleCount * 3);
    const reducedColors = new Float32Array(CONFIG.particleCount * 3);
    const reducedSizes = new Float32Array(CONFIG.particleCount);
    const reducedPhases = new Float32Array(CONFIG.particleCount);
    
    for (let i = 0; i < CONFIG.particleCount; i++) {
        const idx = i * 3;
        const origIdx = Math.floor(i * (200000 / CONFIG.particleCount)) * 3;
        
        reducedPositions[idx] = positions[origIdx];
        reducedPositions[idx + 1] = positions[origIdx + 1];
        reducedPositions[idx + 2] = positions[origIdx + 2];
        reducedColors[idx] = colors[origIdx];
        reducedColors[idx + 1] = colors[origIdx + 1];
        reducedColors[idx + 2] = colors[origIdx + 2];
        reducedSizes[i] = sizes[Math.floor(i * (200000 / CONFIG.particleCount))];
        reducedPhases[i] = phases[Math.floor(i * (200000 / CONFIG.particleCount))];
    }
    
    particlesGeometry.setAttribute('position', new THREE.BufferAttribute(reducedPositions, 3));
    particlesGeometry.setAttribute('color', new THREE.BufferAttribute(reducedColors, 3));
    particlesGeometry.setAttribute('size', new THREE.BufferAttribute(reducedSizes, 1));
    particlesGeometry.setAttribute('phase', new THREE.BufferAttribute(reducedPhases, 1));
}
    </script>
