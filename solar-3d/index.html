<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Solar 3D - Éruptions Solaires Monumentales</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000103;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            font-family: system-ui, -apple-system, sans-serif;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff6b35;
            font-size: 24px;
            z-index: 1000;
            text-align: center;
            text-shadow: 0 0 20px rgba(255, 107, 53, 0.7);
        }
        .loading-dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            background: #ff6b35;
            border-radius: 50%;
            margin: 0 6px;
            animation: pulse 1.2s infinite ease-in-out;
        }
        .loading-dot:nth-child(2) { animation-delay: 0.2s; }
        .loading-dot:nth-child(3) { animation-delay: 0.4s; }
        .loading-dot:nth-child(4) { animation-delay: 0.6s; }
        
        @keyframes pulse {
            0%, 100% { transform: scale(0.6); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 1; }
        }
        
        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 12px;
            padding: 15px 20px;
            font: 14px 'Courier New', monospace;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 107, 53, 0.3);
            display: none;
        }
        
        #info-panel h1 {
            font-size: 18px;
            color: #ff6b35;
            margin-bottom: 8px;
            text-shadow: 0 0 10px rgba(255, 107, 53, 0.5);
        }
        
        #stats {
            color: #a0d0ff;
            font-size: 12px;
            margin-top: 8px;
        }
        
        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            gap: 12px;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px 20px;
            border-radius: 15px;
            border: 1px solid rgba(255, 107, 53, 0.3);
            display: none;
        }
        
        #controls button {
            width: 48px;
            height: 48px;
            border: none;
            border-radius: 10px;
            background: rgba(40, 20, 0, 0.8);
            color: #ff6b35;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s;
            text-shadow: 0 0 5px currentColor;
        }
        
        #controls button:hover {
            background: rgba(80, 40, 0, 0.9);
            transform: scale(1.05);
            box-shadow: 0 0 15px currentColor;
        }
        
        #controls button:active {
            transform: scale(0.95);
        }
        
        #title-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffffff;
            font-size: 48px;
            font-weight: bold;
            text-align: center;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8),
                         0 0 40px rgba(255, 107, 53, 0.5);
            z-index: 10;
            opacity: 0;
            transition: opacity 2s ease-in-out;
            pointer-events: none;
        }
        
        #title-overlay.visible {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div>SOLAR 3D</div>
        <div style="margin-top: 15px;">
            <span class="loading-dot"></span>
            <span class="loading-dot"></span>
            <span class="loading-dot"></span>
            <span class="loading-dot"></span>
        </div>
        <div style="margin-top: 10px; font-size: 14px; color: #a0d0ff;">Chargement des éruptions...</div>
    </div>
    
    <div id="title-overlay">
        SOLAR 3D<br>
        <span style="font-size: 24px; color: #ff6b35;">Éruptions Solaires Monumentales</span>
    </div>
    
    <div id="canvas-container"></div>
    
    <div id="info-panel">
        <h1>SOLAR 3D</h1>
        <div style="color: #a0d0ff; margin-bottom: 8px;">Simulation d'éruptions solaires</div>
        <div id="stats">
            <span><strong>Particules:</strong> <span id="particle-count">180000</span></span> |
            <span><strong>Boucles:</strong> <span id="loop-count">80</span></span> |
            <span><strong>FPS:</strong> <span id="fps-value">0</span></span>
        </div>
    </div>
    
    <div id="controls">
        <button id="btn-pause" title="Pause/Reprendre">⏸</button>
        <button id="btn-reset" title="Réinitialiser">🔄</button>
        <button id="btn-boost" title="Boost">⚡</button>
        <button id="btn-info" title="Infos">ℹ</button>
    </div>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
// ============================================================================
// SOLAR 3D - Simulation d'Éruptions Solaires Monumentales
// Basé sur le script original du Pastebin avec améliorations
// ============================================================================

// Vérification des dépendances
if (typeof THREE === 'undefined' || typeof THREE.OrbitControls === 'undefined') {
    document.getElementById('loading').innerHTML = '<div style="color:#ff4444;">Erreur: Three.js non chargé</div>';
    throw new Error('Three.js libraries not available');
}

// ============================================
// CONFIGURATION
// ============================================
const CONFIG = {
    starRadius: 6.0,
    particleCount: 180000,
    loopCount: 80,
    fogDensity: 0.0018,
    fogColor: 0x000103,
    backgroundColor: 0x000103,
    rotationSpeed: 0.0,
    autoRotate: true,
    autoRotateSpeed: 0.8
};

// ============================================
// Bruit de Simplex 3D (pour les effets organiques)
// ============================================
const SimplexNoise = function() {
    var F3 = 1.0 / 3.0, G3 = 1.0 / 6.0;
    var p = new Uint8Array(256);
    for (var i = 0; i < 256; i++) p[i] = Math.floor(Math.random() * 256);
    var perm = new Uint8Array(512), permMod12 = new Uint8Array(512);
    for (var i = 0; i < 512; i++) {
        perm[i] = p[i & 255];
        permMod12[i] = (perm[i] % 12);
    }
    
    return {
        noise3D: function(xin, yin, zin) {
            var n0, n1, n2, n3;
            var s = (xin + yin + zin) * F3;
            var i = Math.floor(xin + s), j = Math.floor(yin + s), k = Math.floor(zin + s);
            var t = (i + j + k) * G3;
            var X0 = i - t, Y0 = j - t, Z0 = k - t;
            var x0 = xin - X0, y0 = yin - Y0, z0 = zin - Z0;
            var i1, j1, k1, i2, j2, k2;
            
            if (x0 >= y0) {
                if (y0 >= z0) { i1=1; j1=0; k1=0; i2=1; j2=1; k2=0; }
                else if (x0 >= z0) { i1=1; j1=0; k1=0; i2=1; j2=0; k2=1; }
                else { i1=0; j1=0; k1=1; i2=1; j2=0; k2=1; }
            } else {
                if (y0 < z0) { i1=0; j1=0; k1=1; i2=0; j2=1; k2=1; }
                else if (x0 < z0) { i1=0; j1=1; k1=0; i2=0; j2=1; k2=1; }
                else { i1=0; j1=1; k1=0; i2=1; j2=1; k2=0; }
            }
            
            var x1 = x0 - i1 + G3, y1 = y0 - j1 + G3, z1 = z0 - k1 + G3;
            var x2 = x0 - i2 + 2.0*G3, y2 = y0 - j2 + 2.0*G3, z2 = z0 - k2 + 2.0*G3;
            var x3 = x0 - 1.0 + 3.0*G3, y3 = y0 - 1.0 + 3.0*G3, z3 = z0 - 1.0 + 3.0*G3;
            var ii = i & 255, jj = j & 255, kk = k & 255;
            var gi0 = permMod12[ii+perm[jj+perm[kk]]];
            var gi1 = permMod12[ii+i1+perm[jj+j1+perm[kk+k1]]];
            var gi2 = permMod12[ii+i2+perm[jj+j2+perm[kk+k2]]];
            var gi3 = permMod12[ii+1+perm[jj+1+perm[kk+1]]];
            
            var t0 = 0.6 - x0*x0 - y0*y0 - z0*z0; if (t0<0) n0 = 0.0; else { t0 *= t0; n0 = t0 * t0 * (gi0%2===0?1:-1)*(x0 + y0); }
            var t1 = 0.6 - x1*x1 - y1*y1 - z1*z1; if (t1<0) n1 = 0.0; else { t1 *= t1; n1 = t1 * t1 * (gi1%2===0?1:-1)*(x1 + y1); }
            var t2 = 0.6 - x2*x2 - y2*y2 - z2*z2; if (t2<0) n2 = 0.0; else { t2 *= t2; n2 = t2 * t2 * (gi2%2===0?1:-1)*(x2 + y2); }
            var t3 = 0.6 - x3*x3 - y3*y3 - z3*z3; if (t3<0) n3 = 0.0; else { t3 *= t3; n3 = t3 * t3 * (gi3%2===0?1:-1)*(x3 + y3); }
            
            return 32.0 * (n0 + n1 + n2 + n3);
        }
    };
};

// ============================================
// SHADERS PERSONNALISÉS
// ============================================
const starGlowVertexShader = `
    varying vec3 vNormal;
    varying vec3 vWorldPosition;
    
    void main() {
        vNormal = normalize(normalMatrix * normal);
        vec4 worldPos = modelMatrix * vec4(position, 1.0);
        vWorldPosition = worldPos.xyz;
        gl_Position = projectionMatrix * viewMatrix * worldPos;
    }
`;

const starGlowFragmentShader = `
    varying vec3 vNormal;
    varying vec3 vWorldPosition;
    
    uniform float uTime;
    
    void main() {
        vec3 viewDir = normalize(cameraPosition - vWorldPosition);
        float intensity = pow(0.72 - dot(vNormal, viewDir), 3.2);
        
        // Couleurs du soleil (orange chaud, magenta, violet)
        vec3 colCore = vec3(0.9, 0.32, 0.08);
        vec3 colRim = vec3(0.5, 0.04, 0.15);
        vec3 finalColor = mix(colCore, colRim, intensity);
        
        // Pulsation subtile
        float pulse = 1.0 + sin(uTime * 2.5) * 0.02;
        finalColor *= pulse;
        
        gl_FragColor = vec4(finalColor, intensity * 0.82);
    }
`;

const particleVertexShader = `
    attribute float size;
    attribute vec3 color;
    attribute float phase;
    varying vec3 vColor;
    uniform float uTime;
    
    void main() {
        vColor = color;
        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        
        // Scintillement fin et ultra-rapide
        float twinkle = 0.7 + 0.3 * sin(uTime * 7.0 + phase * 12.56);
        gl_PointSize = size * twinkle * (280.0 / -mvPosition.z);
        gl_Position = projectionMatrix * mvPosition;
    }
`;

const particleFragmentShader = `
    varying vec3 vColor;
    
    void main() {
        float r = length(gl_PointCoord - vec2(0.5));
        if (r > 0.5) discard;
        
        float glow = pow(1.0 - (r * 2.0), 2.5);
        vec3 brightCenter = mix(vColor, vec3(1.0, 0.95, 0.85), glow * 0.45);
        gl_FragColor = vec4(brightCenter, glow * 0.9);
    }
`;

// ============================================
// SCÈNE ET RENDU
// ============================================
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(CONFIG.fogColor, CONFIG.fogDensity);
scene.background = new THREE.Color(CONFIG.backgroundColor);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 2000);
camera.position.set(0, 35, 115);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
container.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.035;
controls.maxDistance = 350;
controls.minDistance = 12;
controls.autoRotate = CONFIG.autoRotate;
controls.autoRotateSpeed = CONFIG.autoRotateSpeed;

// ============================================
// COEUR SOLAIRE BIO-ÉNERGÉTIQUE TÉNÉBREUX
// ============================================
const coreGroup = new THREE.Group();
scene.add(coreGroup);

// Noyau interne
const innerGeo = new THREE.SphereGeometry(CONFIG.starRadius * 0.92, 64, 64);
const innerMat = new THREE.MeshBasicMaterial({
    color: 0x180302
});
const innerMesh = new THREE.Mesh(innerGeo, innerMat);
coreGroup.add(innerMesh);

// Glow principal
const glowGeo = new THREE.SphereGeometry(CONFIG.starRadius * 1.06, 64, 64);
const glowMat = new THREE.ShaderMaterial({
    vertexShader: starGlowVertexShader,
    fragmentShader: starGlowFragmentShader,
    uniforms: { uTime: { value: 0 } },
    blending: THREE.AdditiveBlending,
    side: THREE.BackSide,
    transparent: true
});
const glowMesh = new THREE.Mesh(glowGeo, glowMat);
coreGroup.add(glowMesh);

// ============================================
// RÉSEAU COMPLEXE DE BOUCLES CORONALES (CME)
// ============================================
const magneticLoops = [];

function generateCoronalLoops() {
    for (let l = 0; l < CONFIG.loopCount; l++) {
        const theta1 = Math.random() * Math.PI * 2;
        const phi1 = (Math.random() - 0.5) * Math.PI * 0.9;
        
        const p1 = new THREE.Vector3().setFromSphericalCoords(CONFIG.starRadius * 0.95, phi1 + Math.PI/2, theta1);
        
        const span = 0.3 + Math.random() * 2.8;
        const theta2 = theta1 + (Math.random() - 0.5) * span;
        const phi2 = phi1 + (Math.random() - 0.5) * span;
        const p2 = new THREE.Vector3().setFromSphericalCoords(CONFIG.starRadius * 0.95, phi2 + Math.PI/2, theta2);
        
        const mid = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);
        // Arches géantes projetées au loin
        const apexDist = CONFIG.starRadius + 8.0 + Math.pow(Math.random(), 1.5) * 55.0;
        mid.normalize().multiplyScalar(apexDist);
        
        const curve = new THREE.QuadraticBezierCurve3(p1, mid, p2);
        magneticLoops.push({
            curve: curve,
            speed: 0.25 + Math.random() * 0.85,
            twist: 3.0 + Math.random() * 10.0
        });
    }
}

generateCoronalLoops();

// ============================================
// PARTICULES DE PLASMA ULTRAFINES
// ============================================
const particlesGeometry = new THREE.BufferGeometry();
const positions = new Float32Array(CONFIG.particleCount * 3);
const velocities = new Float32Array(CONFIG.particleCount * 3);
const colors = new Float32Array(CONFIG.particleCount * 3);
const sizes = new Float32Array(CONFIG.particleCount);
const phases = new Float32Array(CONFIG.particleCount);

const particleMeta = [];

function initParticles() {
    for (let i = 0; i < CONFIG.particleCount; i++) {
        const idx = i * 3;
        const isLoopParticle = i < CONFIG.particleCount * 0.6;
        
        if (isLoopParticle) {
            const loopIndex = i % CONFIG.loopCount;
            particleMeta.push({
                type: 'loop',
                loopIdx: loopIndex,
                progress: Math.random(),
                speed: 0.15 + Math.random() * 0.6,
                offset: (Math.random() - 0.5) * 1.8
            });
            
            positions[idx] = 0;
            positions[idx + 1] = 0;
            positions[idx + 2] = 0;
            
        } else {
            particleMeta.push({
                type: 'eruptive',
                baseSpeed: 1.2 + Math.random() * 3.5
            });
            
            const u = Math.random();
            const v = Math.random();
            const theta = u * 2.0 * Math.PI;
            const phi = Math.acos(2.0 * v - 1.0);
            const r = CONFIG.starRadius + 0.1;
            
            positions[idx] = r * Math.sin(phi) * Math.cos(theta);
            positions[idx + 1] = r * Math.sin(phi) * Math.sin(theta);
            positions[idx + 2] = r * Math.cos(phi);
            
            const speed = particleMeta[i].baseSpeed;
            velocities[idx] = (positions[idx] / r) * speed;
            velocities[idx + 1] = (positions[idx + 1] / r) * speed;
            velocities[idx + 2] = (positions[idx + 2] / r) * speed;
        }
        
        // Palette Incandescente & Harmonieuse
        const color = new THREE.Color();
        const rand = Math.random();
        if (rand < 0.4) {
            color.setHSL(0.05 + Math.random() * 0.03, 1.0, 0.48); // Braise Orange Chaud
        } else if (rand < 0.72) {
            color.setHSL(0.96 + Math.random() * 0.05, 0.95, 0.45); // Magenta / Violet Éruptif
        } else if (rand < 0.92) {
            color.setHSL(0.1 + Math.random() * 0.04, 1.0, 0.58); // Or Solaire
        } else {
            color.setHSL(0.52 + Math.random() * 0.06, 1.0, 0.65); // Étincelle Cyan / Saphir
        }
        
        colors[idx] = color.r;
        colors[idx + 1] = color.g;
        colors[idx + 2] = color.b;
        
        // Finesse des grains de lumière
        sizes[i] = 0.6 + Math.random() * 1.8;
        phases[i] = Math.random();
    }
    
    particlesGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    particlesGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    particlesGeometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
    particlesGeometry.setAttribute('phase', new THREE.BufferAttribute(phases, 1));
}

initParticles();

const particleMaterial = new THREE.ShaderMaterial({
    vertexShader: particleVertexShader,
    fragmentShader: particleFragmentShader,
    uniforms: { uTime: { value: 0 } },
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false
});

const starParticles = new THREE.Points(particlesGeometry, particleMaterial);
scene.add(starParticles);

// ============================================
// INTERACTION TACTILE / POINTER
// ============================================
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let isInteracting = false;
let interactionPoint = new THREE.Vector3();

function updatePointer(e) {
    const x = e.touches ? e.touches[0].clientX : e.clientX;
    const y = e.touches ? e.touches[0].clientY : e.clientY;
    mouse.x = (x / window.innerWidth) * 2 - 1;
    mouse.y = -(y / window.innerHeight) * 2 + 1;
    
    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObject(glowMesh);
    if (intersects.length > 0) {
        interactionPoint.copy(intersects[0].point);
        isInteracting = true;
    } else {
        isInteracting = false;
    }
}

window.addEventListener('pointerdown', (e) => { updatePointer(e); isInteracting = true; });
window.addEventListener('pointermove', (e) => { if (e.buttons > 0 || e.touches) updatePointer(e); });
window.addEventListener('pointerup', () => { isInteracting = false; });

// ============================================
// BOUCLE PHYSIQUE & ANIMATION
// ============================================
const clock = new THREE.Clock();
const simplex = SimplexNoise();

function animate() {
    requestAnimationFrame(animate);
    
    const dt = Math.min(clock.getDelta(), 0.05);
    const time = clock.getElapsedTime();
    
    particleMaterial.uniforms.uTime.value = time;
    glowMesh.material.uniforms.uTime.value = time;
    
    // Pulsation vivante du cœur
    const pulse = 1.0 + Math.sin(time * 2.5) * 0.02 + simplex.noise3D(time * 0.6, 0, 0) * 0.025;
    coreGroup.scale.set(pulse, pulse, pulse);
    
    const posAttr = particlesGeometry.attributes.position;
    
    for (let i = 0; i < CONFIG.particleCount; i++) {
        const idx = i * 3;
        const meta = particleMeta[i];
        
        if (meta.type === 'loop') {
            // Trajectoire hélicoïdale le long d'une boucle coronale
            meta.progress += dt * meta.speed;
            if (meta.progress > 1.0) meta.progress = 0;
            
            const loop = magneticLoops[meta.loopIdx];
            const point = loop.curve.getPoint(meta.progress);
            
            const tangent = loop.curve.getTangent(meta.progress);
            const normal = new THREE.Vector3(0, 1, 0).cross(tangent).normalize();
            const binormal = tangent.clone().cross(normal).normalize();
            
            const angle = meta.progress * Math.PI * 2 * loop.twist + time * 6.0;
            const radius = meta.offset * (1.0 - Math.pow(meta.progress - 0.5, 2) * 3.4);
            
            positions[idx] = point.x + (normal.x * Math.cos(angle) + binormal.x * Math.sin(angle)) * radius;
            positions[idx + 1] = point.y + (normal.y * Math.cos(angle) + binormal.y * Math.sin(angle)) * radius;
            positions[idx + 2] = point.z + (normal.z * Math.cos(angle) + binormal.z * Math.sin(angle)) * radius;
            
        } else {
            // Éjections libres ultradynamiques
            let px = positions[idx];
            let py = positions[idx + 1];
            let pz = positions[idx + 2];
            
            let vx = velocities[idx];
            let vy = velocities[idx + 1];
            let vz = velocities[idx + 2];
            
            // Bruit de turbulence de Simplex multi-fréquence
            const noiseScale = 0.04;
            const nX = simplex.noise3D(px * noiseScale, py * noiseScale, time * 0.9);
            const nY = simplex.noise3D(py * noiseScale, pz * noiseScale, time * 0.9);
            const nZ = simplex.noise3D(pz * noiseScale, px * noiseScale, time * 0.9);
            
            vx += nX * dt * 5.5;
            vy += nY * dt * 5.5;
            vz += nZ * dt * 5.5;
            
            // Activation éruptive au toucher
            if (isInteracting) {
                const distToTouch = interactionPoint.distanceTo(new THREE.Vector3(px, py, pz));
                if (distToTouch < 35.0) {
                    const boost = (35.0 - distToTouch) * 1.2;
                    const dir = new THREE.Vector3(px, py, pz).normalize();
                    vx += dir.x * boost;
                    vy += dir.y * boost;
                    vz += dir.z * boost;
                }
            }
            
            // Rappel gravitationnel souple
            const distSq = px * px + py * py + pz * pz;
            const dist = Math.sqrt(distSq);
            const gravity = 22.0 / (distSq + 1.0);
            
            vx -= (px / dist) * gravity * dt * 10;
            vy -= (py / dist) * gravity * dt * 10;
            vz -= (pz / dist) * gravity * dt * 10;
            
            px += vx * dt * 10;
            py += vy * dt * 10;
            pz += vz * dt * 10;
            
            // Récurrence
            if (dist < CONFIG.starRadius * 0.95 || dist > 110.0) {
                const u = Math.random();
                const v = Math.random();
                const theta = u * 2.0 * Math.PI;
                const phi = Math.acos(2.0 * v - 1.0);
                const r = CONFIG.starRadius + 0.1;
                
                px = r * Math.sin(phi) * Math.cos(theta);
                py = r * Math.sin(phi) * Math.sin(theta);
                pz = r * Math.cos(phi);
                
                const speed = meta.baseSpeed * (1.2 + Math.random() * 2.5);
                vx = (px / r) * speed;
                vy = (py / r) * speed;
                vz = (pz / r) * speed;
            }
            
            positions[idx] = px;
            positions[idx + 1] = py;
            positions[idx + 2] = pz;
            
            velocities[idx] = vx;
            velocities[idx + 1] = vy;
            velocities[idx + 2] = vz;
        }
    }
    
    posAttr.needsUpdate = true;
    controls.update();
    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// ============================================
// CONTRÔLES UI
// ============================================
function initControls() {
    document.getElementById('btn-pause').onclick = () => {
        const isPaused = controls.autoRotate;
        controls.autoRotate = !isPaused;
        document.getElementById('btn-pause').textContent = isPaused ? '▶' : '⏸';
    };
    
    document.getElementById('btn-reset').onclick = () => {
        // Réinitialiser les particules
        initParticles();
        particlesGeometry.attributes.position.needsUpdate = true;
        particlesGeometry.attributes.velocity.needsUpdate = true;
    };
    
    document.getElementById('btn-boost').onclick = () => {
        // Boost d'énergie
        for (let i = 0; i < CONFIG.particleCount; i++) {
            const idx = i * 3;
            velocities[idx] += (Math.random() - 0.5) * 5;
            velocities[idx + 1] += (Math.random() - 0.5) * 5;
            velocities[idx + 2] += (Math.random() - 0.5) * 5;
        }
    };
    
    document.getElementById('btn-info').onclick = () => {
        const panel = document.getElementById('info-panel');
        panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
    };
    
    // Afficher les contrôles et infos après chargement
    setTimeout(() => {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('info-panel').style.display = 'block';
        document.getElementById('controls').style.display = 'flex';
        document.getElementById('title-overlay').classList.add('visible');
        
        // Masquer le titre après 5 secondes
        setTimeout(() => {
            document.getElementById('title-overlay').classList.remove('visible');
        }, 5000);
    }, 2000);
    
    // Stats
    let frameCount = 0;
    let fpsTime = Date.now();
    
    function updateStats() {
        frameCount++;
        const now = Date.now();
        if (now - fpsTime >= 1000) {
            document.getElementById('fps-value').textContent = frameCount;
            frameCount = 0;
            fpsTime = now;
        }
        requestAnimationFrame(updateStats);
    }
    updateStats();
}

initControls();

// ============================================
// DÉMARRAGE
// ============================================
window.onload = () => {
    animate();
};
    </script>
