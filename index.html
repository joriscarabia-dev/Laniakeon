    <!-- CODE PRINCIPAL - S'exécute UNIQUEMENT si tout est chargé -->
    <script>
// ============================================================================
// KEADEX - MOTEUR CATHARTIQUE INFINI
// Version ultra-robuste avec vérification complète
// ============================================================================

// Vérification finale
if (typeof THREE === 'undefined' || typeof THREE.OrbitControls === 'undefined') {
    const errorPanel = document.getElementById('error-panel');
    errorPanel.innerHTML = '<h2>Erreur Critique</h2><p>Three.js ou OrbitControls n\'a pas pu être chargé.</p><p style="margin-top:15px;font-size:14px">Essayez de recharger la page (Ctrl+F5) ou utilisez un autre navigateur.</p>';
    errorPanel.style.display = 'block';
    document.getElementById('loading').style.display = 'none';
    throw new Error('Three.js libraries not available');
}

// ============================================
// CONFIGURATION
// ============================================
const CFG = {
    particles: 60000,
    rotationSpeed: 0.05,
    fogDensity: 0.002,
    genomeSize: 512,
    mutationRate: 0.0005,
    evolutionSpeed: 0.0015,
    memorySize: 300,
    similarityThreshold: 0.8,
    fieldCount: 12
};

// ============================================
// PALETTES
// ============================================
const PALETTES = [
    { colors: [0x22d3ee, 0xa855f7, 0xec4899, 0xf97316, 0x84cc16, 0xef4444], fog: 0x000000, ambient: 0x1e1b4b },
    { colors: [0xef4444, 0xf97316, 0xeab308, 0x84cc16, 0x22c55e, 0x06b6d4], fog: 0x0a041a, ambient: 0x2d1b2d },
    { colors: [0x06b6d4, 0x22c55e, 0xa855f7, 0xec4899, 0xf97316, 0xfbbf24], fog: 0x000011, ambient: 0x061e2a },
    { colors: [0x3b82f6, 0x8b5cf6, 0xec4899, 0xf97316, 0xeab308, 0x10b981], fog: 0x000000, ambient: 0x1f2937 },
    { colors: [0xffffff, 0x6366f1, 0x8b5cf6, 0x000000, 0x374151, 0x6b7280], fog: 0x000000, ambient: 0x000000 }
];

// ============================================
// SYSTÈME DE MÉMOIRE
// ============================================
class MemorySystem {
    constructor(size = CFG.memorySize) {
        this.size = size;
        this.history = [];
    }
    
    extractFeatures(geometry) {
        const pos = geometry.attributes.position.array;
        const count = pos.length / 3;
        const features = new Array(64).fill(0);
        
        let sumX = 0, sumY = 0, sumZ = 0;
        let sumX2 = 0, sumY2 = 0, sumZ2 = 0;
        for (let i = 0; i < count; i++) {
            const idx = i * 3;
            const x = pos[idx], y = pos[idx+1], z = pos[idx+2];
            sumX += x; sumY += y; sumZ += z;
            sumX2 += x*x; sumY2 += y*y; sumZ2 += z*z;
        }
        features[0] = sumX2/count - (sumX/count)**2;
        features[1] = sumY2/count - (sumY/count)**2;
        features[2] = sumZ2/count - (sumZ/count)**2;
        
        const dists = [];
        for (let i = 0; i < count; i++) {
            const idx = i * 3;
            const x = pos[idx] - sumX/count;
            const y = pos[idx+1] - sumY/count;
            const z = pos[idx+2] - sumZ/count;
            dists.push(Math.sqrt(x*x + y*y + z*z));
        }
        dists.sort((a,b) => a-b);
        features[3] = dists[0]; features[4] = dists[Math.floor(dists.length/2)]; features[5] = dists[dists.length-1];
        
        const maxD = features[5] || 1;
        for (let i = 0; i < count; i++) {
            const d = dists[i] / maxD;
            const bin = Math.min(15, Math.floor(d * 16));
            features[6 + bin] += 1/count;
        }
        
        let complexity = 0;
        for (let i = 100; i < Math.min(count, 1000); i += 5) {
            const idx = i * 3;
            const x1 = pos[idx], y1 = pos[idx+1], z1 = pos[idx+2];
            const x2 = pos[(i+1)*3], y2 = pos[(i+1)*3+1], z2 = pos[(i+1)*3+2];
            complexity += Math.sqrt((x2-x1)**2 + (y2-y1)**2 + (z2-z1)**2);
        }
        features[22] = complexity/180;
        
        return features;
    }
    
    record(geometry) {
        const features = this.extractFeatures(geometry);
        this.history.push({ features, time: Date.now() });
        if (this.history.length > this.size) this.history.shift();
        return features;
    }
    
    calculateSimilarity(features) {
        if (this.history.length === 0) return 0;
        let maxSim = 0;
        for (const entry of this.history) {
            let sim = 0;
            for (let i = 0; i < 64; i++) {
                const diff = (features[i]||0) - (entry.features[i]||0);
                sim += Math.exp(-Math.abs(diff) * 3);
            }
            maxSim = Math.max(maxSim, sim/64);
        }
        return maxSim;
    }
    
    getDiversity() {
        if (this.history.length < 2) return 1;
        let total = 0, count = 0;
        const n = Math.min(this.history.length, 30);
        for (let i = 0; i < n; i++) {
            for (let j = i+1; j < n; j++) {
                let sim = 0;
                for (let k = 0; k < 64; k++) {
                    const diff = (this.history[i].features[k]||0) - (this.history[j].features[k]||0);
                    sim += Math.exp(-Math.abs(diff) * 3);
                }
                total += 1 - sim/64; count++;
            }
        }
        return Math.min(1, total/(count||1));
    }
}

// ============================================
// GÉNOME
// ============================================
class Genome {
    constructor(size = CFG.genomeSize) {
        this.size = size;
        this.genes = new Float32Array(size);
        this.velocities = new Float32Array(size);
        this.targets = new Float32Array(size);
        this.age = 0;
        
        for (let i = 0; i < size; i++) {
            this.genes[i] = Math.random();
            this.velocities[i] = (Math.random()-0.5) * 0.02;
            this.targets[i] = Math.random();
        }
    }
    
    get(index) { return this.genes[index % this.size]; }
    getRange(index, min, max) { return min + this.get(index) * (max - min); }
    getSigned(index) { return this.get(index) * 2 - 1; }
    
    mutate(rate = CFG.mutationRate) {
        for (let i = 0; i < this.size; i++) {
            if (Math.random() < rate) {
                this.genes[i] += (Math.random()-0.5) * 0.3;
                this.genes[i] = Math.max(0, Math.min(1, this.genes[i]));
            }
        }
    }
    
    evolve(speed = CFG.evolutionSpeed) {
        this.age++;
        for (let i = 0; i < this.size; i++) {
            if (Math.random() < 0.005) this.targets[i] = Math.random();
            const diff = this.targets[i] - this.genes[i];
            this.velocities[i] += diff * speed * 0.1 + (Math.random()-0.5) * 0.002;
            this.velocities[i] *= 0.98;
            this.genes[i] += this.velocities[i];
            this.genes[i] = Math.max(0, Math.min(1, this.genes[i]));
        }
    }
    
    perturb(magnitude = 0.5) {
        for (let i = 0; i < this.size; i++) {
            this.genes[i] += (Math.random()-0.5) * magnitude;
            this.genes[i] = Math.max(0, Math.min(1, this.genes[i]));
            this.targets[i] = this.genes[i] + (Math.random()-0.5) * 0.2;
        }
    }
}

// ============================================
// CHAMP DE FORCES
// ============================================
class ForceField {
    constructor(genome, index) {
        this.genome = genome;
        this.index = index;
        this.baseOffset = index * 16;
    }
    
    calculate(x, y, z, time) {
        const g = this.genome;
        const t = time * 0.001;
        const fieldType = g.get(this.baseOffset);
        const cx = g.getRange(this.baseOffset+1, -10, 10);
        const cy = g.getRange(this.baseOffset+2, -10, 10);
        const cz = g.getRange(this.baseOffset+3, -10, 10);
        const strength = g.getRange(this.baseOffset+4, -3, 3);
        const radius = g.getRange(this.baseOffset+5, 0.5, 30);
        const frequency = g.getRange(this.baseOffset+6, 0.01, 10);
        const phase = g.getRange(this.baseOffset+7, 0, Math.PI*2);
        const chaos = g.get(this.baseOffset+8);
        const turbulence = g.get(this.baseOffset+9);
        const growth = g.getSigned(this.baseOffset+11);
        const dirX = g.getSigned(this.baseOffset+12);
        const dirY = g.getSigned(this.baseOffset+13);
        const dirZ = g.getSigned(this.baseOffset+14);
        
        const dx = x - cx;
        const dy = y - cy;
        const dz = z - cz;
        const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
        
        let fx = 0, fy = 0, fz = 0;
        
        if (dist < radius) {
            const normDist = dist / radius;
            const falloff = 1 - normDist * normDist;
            const timeMod = Math.sin(t * frequency + phase);
            const chaosMod = 1 + chaos * Math.sin(t * 17 + phase * 3) * 0.5;
            
            if (fieldType < 0.25) {
                const direction = strength > 0 ? 1 : -1;
                const force = direction * strength * falloff * timeMod * chaosMod;
                fx = dx * force; fy = dy * force; fz = dz * force;
            } else if (fieldType < 0.5) {
                const vortex = strength * 3 * falloff * timeMod * chaosMod;
                fx = -dy * vortex; fy = dx * vortex; fz = 0;
            } else if (fieldType < 0.75) {
                const torsion = strength * 2 * falloff * timeMod * chaosMod;
                fx = (-dy + dz) * torsion; fy = (dx - dz) * torsion; fz = (-dx + dy) * torsion;
            } else {
                const magnitude = falloff * Math.abs(strength) * (0.7 + 0.3 * timeMod) * chaosMod;
                const turbX = Math.sin(x * turbulence * 3 + t) * 0.3;
                const turbY = Math.sin(y * turbulence * 3 + t * 1.3) * 0.3;
                const turbZ = Math.sin(z * turbulence * 3 + t * 1.7) * 0.3;
                fx = (dirX + turbX) * magnitude; fy = (dirY + turbY) * magnitude; fz = (dirZ + turbZ) * magnitude;
            }
            
            if (growth !== 0) {
                const growForce = growth * 0.1 * falloff * timeMod;
                fx += dx * growForce; fy += dy * growForce; fz += dz * growForce;
            }
        }
        
        return { x: fx, y: fy, z: fz };
    }
}

// ============================================
// SYSTÈME DE PARTICULES
// ============================================
class ParticleSystem {
    constructor(genome, count) {
        this.genome = genome;
        this.count = count;
        this.particles = [];
        this.geometry = null;
        this.material = null;
        this.mesh = null;
        
        this.forceFields = [];
        for (let i = 0; i < CFG.fieldCount; i++) {
            this.forceFields.push(new ForceField(genome, i));
        }
        
        this.initParticles();
    }
    
    initParticles() {
        const positions = new Float32Array(this.count * 3);
        const colors = new Float32Array(this.count * 3);
        const sizes = new Float32Array(this.count);
        
        const palette = PALETTES[0].colors;
        
        for (let i = 0; i < this.count; i++) {
            const initType = Math.floor(this.genome.get(i % 100) * 6);
            let x, y, z;
            
            switch(initType) {
                case 0:
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos(2 * Math.random() - 1);
                    const r = Math.pow(Math.random(), 1/3) * 5;
                    x = r * Math.sin(phi) * Math.cos(theta);
                    y = r * Math.sin(phi) * Math.sin(theta);
                    z = r * Math.cos(phi);
                    break;
                case 1:
                    x = (Math.random() - 0.5) * 6;
                    y = (Math.random() - 0.5) * 6;
                    z = (Math.random() - 0.5) * 6;
                    break;
                case 2:
                    x = (Math.random() - 0.5) * 10;
                    y = (Math.random() - 0.5) * 2;
                    z = (Math.random() - 0.5) * 2;
                    break;
                case 3:
                    const angle = Math.random() * Math.PI * 20;
                    const radius = Math.random() * 5;
                    x = radius * Math.cos(angle);
                    y = radius * Math.sin(angle);
                    z = angle * 0.1;
                    break;
                case 4:
                    x = (Math.floor(Math.random() * 5) - 2) * 1.5 + (Math.random() - 0.5) * 0.5;
                    y = (Math.floor(Math.random() * 5) - 2) * 1.5 + (Math.random() - 0.5) * 0.5;
                    z = (Math.floor(Math.random() * 5) - 2) * 1.5 + (Math.random() - 0.5) * 0.5;
                    break;
                default:
                    x = (Math.random() - 0.5) * 10;
                    y = (Math.random() - 0.5) * 10;
                    z = (Math.random() - 0.5) * 10;
            }
            
            positions[i*3] = x; positions[i*3+1] = y; positions[i*3+2] = z;
            
            const color = new THREE.Color(palette[Math.floor(Math.random() * palette.length)]);
            colors[i*3] = color.r; colors[i*3+1] = color.g; colors[i*3+2] = color.b;
            sizes[i] = 0.02 + Math.random() * 0.06;
            
            this.particles.push({
                x: x, y: y, z: z,
                vx: (Math.random() - 0.5) * 0.02,
                vy: (Math.random() - 0.5) * 0.02,
                vz: (Math.random() - 0.5) * 0.02,
                color: color,
                size: sizes[i],
                age: Math.random() * 100,
                energy: 0.5 + Math.random() * 0.5
            });
        }
        
        this.updateGeometry();
        this.material = new THREE.PointsMaterial({
            size: 0.04,
            vertexColors: true,
            transparent: true,
            opacity: 0.9,
            sizeAttenuation: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        this.mesh = new THREE.Points(this.geometry, this.material);
    }
    
    updateGeometry() {
        const positions = new Float32Array(this.count * 3);
        const colors = new Float32Array(this.count * 3);
        const sizes = new Float32Array(this.count);
        
        for (let i = 0; i < this.count; i++) {
            const p = this.particles[i];
            positions[i*3] = p.x; positions[i*3+1] = p.y; positions[i*3+2] = p.z;
            colors[i*3] = p.color.r; colors[i*3+1] = p.color.g; colors[i*3+2] = p.color.b;
            sizes[i] = p.size;
        }
        
        if (this.geometry) this.geometry.dispose();
        this.geometry = new THREE.BufferGeometry();
        this.geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        this.geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        this.geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
        this.mesh.geometry = this.geometry;
    }
    
    update(deltaTime, globalTime) {
        const g = this.genome;
        const globalChaos = g.getRange(0, 0, 1);
        const mergeRate = g.getRange(1, 0, 0.02);
        const noiseScale = g.getRange(3, 0.01, 2);
        const colorChangeRate = g.getRange(4, 0, 0.01);
        const maxVelocity = g.getRange(5, 0.01, 0.5);
        
        for (let i = 0; i < this.count; i++) {
            const p = this.particles[i];
            
            let fx = 0, fy = 0, fz = 0;
            for (const field of this.forceFields) {
                const force = field.calculate(p.x, p.y, p.z, globalTime);
                fx += force.x; fy += force.y; fz += force.z;
            }
            
            fx += (Math.random() - 0.5) * noiseScale * globalChaos * 2;
            fy += (Math.random() - 0.5) * noiseScale * globalChaos * 2;
            fz += (Math.random() - 0.5) * noiseScale * globalChaos * 2;
            
            p.vx += fx * deltaTime * 60;
            p.vy += fy * deltaTime * 60;
            p.vz += fz * deltaTime * 60;
            
            const speed = Math.sqrt(p.vx*p.vx + p.vy*p.vy + p.vz*p.vz);
            if (speed > maxVelocity) {
                p.vx *= maxVelocity / speed;
                p.vy *= maxVelocity / speed;
                p.vz *= maxVelocity / speed;
            }
            
            p.x += p.vx * deltaTime * 60;
            p.y += p.vy * deltaTime * 60;
            p.z += p.vz * deltaTime * 60;
            
            p.age += deltaTime * 10;
            p.energy = Math.min(1, p.energy + deltaTime * 0.01);
            
            if (Math.random() < colorChangeRate * deltaTime * 60) {
                const palette = PALETTES[0].colors;
                p.color = new THREE.Color(palette[Math.floor(Math.random() * palette.length)]);
            }
            
            p.size = 0.02 + Math.sin(p.age * 0.01) * 0.02 + p.energy * 0.02;
            
            const maxDist = 25;
            const dist = Math.sqrt(p.x*p.x + p.y*p.y + p.z*p.z);
            if (dist > maxDist) {
                p.x *= maxDist / dist; p.y *= maxDist / dist; p.z *= maxDist / dist;
                p.vx *= -0.3; p.vy *= -0.3; p.vz *= -0.3;
            }
            
            if (Math.random() < mergeRate * deltaTime * 60) {
                const otherIdx = Math.floor(Math.random() * this.count);
                if (otherIdx !== i) {
                    const other = this.particles[otherIdx];
                    const dx = other.x - p.x, dy = other.y - p.y, dz = other.z - p.z;
                    const dist2 = Math.sqrt(dx*dx + dy*dy + dz*dz);
                    if (dist2 < 0.8) {
                        p.x += dx * 0.2; p.y += dy * 0.2; p.z += dz * 0.2;
                        p.vx += other.vx * 0.1; p.vy += other.vy * 0.1; p.vz += other.vz * 0.1;
                        p.energy = Math.min(1, p.energy + other.energy * 0.1);
                    }
                }
            }
            
            if (Math.random() < 0.0001 * deltaTime * 60 && p.energy > 0.8) {
                p.vx += (Math.random() - 0.5) * 2;
                p.vy += (Math.random() - 0.5) * 2;
                p.vz += (Math.random() - 0.5) * 2;
                p.energy = 0.1;
            }
        }
        
        this.updateGeometry();
    }
    
    perturb() {
        for (let i = 0; i < this.count; i++) {
            const p = this.particles[i];
            p.vx += (Math.random() - 0.5) * 0.5;
            p.vy += (Math.random() - 0.5) * 0.5;
            p.vz += (Math.random() - 0.5) * 0.5;
            p.energy = Math.min(1, p.energy + 0.3);
        }
    }
    
    changePalette(index) {
        const palette = PALETTES[index % PALETTES.length].colors;
        for (let i = 0; i < this.count; i++) {
            if (Math.random() < 0.2) {
                this.particles[i].color = new THREE.Color(palette[Math.floor(Math.random() * palette.length)]);
            }
        }
    }
    
    getGeometry() { return this.geometry; }
    getMesh() { return this.mesh; }
}

// ============================================
// MOTEUR D'ÉVOLUTION
// ============================================
class EvolutionEngine {
    constructor(genome, memory) {
        this.genome = genome;
        this.memory = memory;
        this.lastDiversity = 1.0;
        this.lastSimilarity = 0.0;
        this.counter = 0;
    }
    
    evaluate(geometry) {
        const features = this.memory.record(geometry);
        const similarity = this.memory.calculateSimilarity(features);
        const diversity = this.memory.getDiversity();
        this.lastSimilarity = similarity;
        this.lastDiversity = diversity;
        return diversity * (1 - similarity);
    }
    
    evolve(geometry) {
        this.counter++;
        const fitness = this.evaluate(geometry);
        
        if (this.lastSimilarity > CFG.similarityThreshold) {
            this.genome.perturb(0.8);
            return;
        }
        
        const speed = CFG.evolutionSpeed * (0.4 * (1 - this.lastSimilarity) + 0.6 * this.lastDiversity);
        this.genome.evolve(speed);
        this.genome.mutate(CFG.mutationRate * (1 + (1 - this.lastDiversity)));
        
        if (Math.random() < CFG.explorationRate || this.counter % 500 === 0) {
            this.genome.perturb(0.4);
        }
    }
}

// ============================================
// SYSTÈME PRINCIPAL
// ============================================
class Keadex {
    constructor() {
        this.container = document.getElementById('canvas-container');
        this.scene = null; this.camera = null; this.renderer = null;
        this.controls = null; this.particleSystem = null; this.genome = null;
        this.memory = null; this.evolution = null; this.paletteIndex = 0;
        this.isPaused = false; this.globalTime = 0; this.lastTime = 0;
        this.frameCount = 0; this.fpsTime = 0;
        
        this.init();
    }
    
    init() {
        const isMobile = window.matchMedia('(max-width: 800px)').matches;
        if (isMobile) CFG.particles = Math.floor(CFG.particles * 0.5);
        
        this.initThreeJS();
        this.genome = new Genome();
        this.memory = new MemorySystem();
        this.particleSystem = new ParticleSystem(this.genome, CFG.particles);
        this.scene.add(this.particleSystem.getMesh());
        this.evolution = new EvolutionEngine(this.genome, this.memory);
        
        this.initControls();
        this.updateUI();
        
        // Masquer le chargement
        document.getElementById('loading').style.display = 'none';
        document.getElementById('info-panel').style.display = 'block';
        document.getElementById('controls').style.display = 'flex';
        
        this.animate();
    }
    
    initThreeJS() {
        this.scene = new THREE.Scene();
        this.scene.fog = new THREE.FogExp2(PALETTES[0].fog, CFG.fogDensity);
        this.scene.background = new THREE.Color(PALETTES[0].fog);
        
        this.camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
        this.camera.position.set(0, 0, 30);
        
        this.renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
        this.renderer.toneMappingExposure = 1.0;
        this.container.appendChild(this.renderer.domElement);
        
        this.controls = new THREE.OrbitControls(this.camera, this.renderer.domElement);
        this.controls.enableDamping = true;
        this.controls.dampingFactor = 0.05;
        this.controls.maxDistance = 100;
        this.controls.minDistance = 15;
        
        const ambient = new THREE.AmbientLight(PALETTES[0].ambient, 0.5);
        this.scene.add(ambient);
        const point = new THREE.PointLight(0xffffff, 0.8, 100);
        point.position.set(20, 20, 20);
        this.scene.add(point);
        
        window.addEventListener('resize', () => {
            this.camera.aspect = window.innerWidth/window.innerHeight;
            this.camera.updateProjectionMatrix();
            this.renderer.setSize(window.innerWidth, window.innerHeight);
        });
    }
    
    initControls() {
        document.getElementById('btn-pause').onclick = () => {
            this.isPaused = !this.isPaused;
            document.getElementById('btn-pause').textContent = this.isPaused ? '▶' : '⏸';
        };
        document.getElementById('btn-catharsis').onclick = () => this.catharsis();
        document.getElementById('btn-evolve').onclick = () => this.genome.perturb(0.5);
        document.getElementById('btn-palette').onclick = () => {
            this.paletteIndex = (this.paletteIndex + 1) % PALETTES.length;
            const p = PALETTES[this.paletteIndex];
            this.scene.fog.color.setHex(p.fog);
            this.scene.background.setHex(p.fog);
            this.particleSystem.changePalette(this.paletteIndex);
        };
        document.getElementById('btn-info').onclick = () => {
            const panel = document.getElementById('info-panel');
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        };
        
        document.onkeydown = (e) => {
            if (e.key === ' ') this.genome.perturb(0.3);
            else if (e.key === 'p' || e.key === 'P') {
                this.isPaused = !this.isPaused;
                document.getElementById('btn-pause').textContent = this.isPaused ? '▶' : '⏸';
            }
            else if (e.key === 'c' || e.key === 'C') this.catharsis();
            else if (e.key === 'r' || e.key === 'R') this.reset();
            else if (e.key === 'e' || e.key === 'E') this.genome.perturb(0.5);
            else if (e.key === 'i' || e.key === 'I') {
                const panel = document.getElementById('info-panel');
                panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
            }
        };
        
        this.renderer.domElement.onclick = () => this.genome.perturb(0.2);
    }
    
    catharsis() {
        this.scene.remove(this.particleSystem.getMesh());
        this.genome = new Genome();
        this.memory = new MemorySystem();
        this.particleSystem = new ParticleSystem(this.genome, CFG.particles);
        this.scene.add(this.particleSystem.getMesh());
        this.evolution = new EvolutionEngine(this.genome, this.memory);
    }
    
    reset() {
        this.scene.remove(this.particleSystem.getMesh());
        this.genome = new Genome();
        this.memory = new MemorySystem();
        this.particleSystem = new ParticleSystem(this.genome, CFG.particles);
        this.scene.add(this.particleSystem.getMesh());
        this.evolution = new EvolutionEngine(this.genome, this.memory);
    }
    
    updateUI() {
        document.getElementById('diversity-value').textContent = Math.round(this.evolution.lastDiversity * 100) + '%';
        document.getElementById('complexity-value').textContent = Math.round(this.evolution.lastSimilarity * 100) + '%';
        document.getElementById('energy-value').textContent = Math.round(this.genome.age / 10) + '%';
    }
    
    animate() {
        requestAnimationFrame(() => this.animate());
        const now = Date.now();
        const deltaTime = Math.min(0.1, (now - this.lastTime) / 1000);
        this.lastTime = now;
        this.globalTime += deltaTime * 1000;
        
        if (!this.isPaused) {
            this.particleSystem.update(deltaTime, this.globalTime);
            
            if (this.frameCount % 3 === 0) {
                this.evolution.evaluate(this.particleSystem.getGeometry());
                this.evolution.evolve(this.particleSystem.getGeometry());
                this.updateUI();
            }
            
            this.particleSystem.getMesh().rotation.y += CFG.rotationSpeed * deltaTime;
            this.controls.update();
        }
        
        this.frameCount++;
        if (now - this.fpsTime >= 1000) {
            document.getElementById('fps-value').textContent = this.frameCount;
            this.frameCount = 0; this.fpsTime = now;
        }
        
        this.renderer.render(this.scene, this.camera);
    }
}

// ============================================
// DÉMARRAGE
// ============================================
try {
    new Keadex();
} catch (error) {
    const errorPanel = document.getElementById('error-panel');
    errorPanel.innerHTML = '<h2>Erreur</h2><p>' + error.message + '</p><p style="margin-top:15px;font-size:14px">Vérifiez votre connexion ou désactivez les bloquers de scripts.</p>';
    errorPanel.style.display = 'block';
    document.getElementById('loading').style.display = 'none';
}
    </script>
